name: Benchmark

on:
  workflow_dispatch:
    inputs:
      first_ref:
        description: "First ref/SHA to benchmark"
        required: true
        type: string
      second_ref:
        description: "Second ref/SHA to benchmark"
        required: true
        type: string

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Checkout first
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.first_ref }}

      - name: Run benchmark on first
        run: |
          dotnet run --project Etch.Benchmarks -c Release -- \
            --filter '*' \
            --exporters markdown \
            --artifacts ./BenchmarkDotNet.Artifacts/first

      - name: Checkout second
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.second_ref }}

      - name: Run benchmark on second
        run: |
          dotnet run --project Etch.Benchmarks -c Release -- \
            --filter '*' \
            --exporters markdown \
            --artifacts ./BenchmarkDotNet.Artifacts/second

      - name: Write results to job summary
        if: always()
        run: |
          {
            for dir in first second; do
              echo "## $dir"
              report=$(find "BenchmarkDotNet.Artifacts/$dir/results" -name '*-report-github.md' -print -quit 2>/dev/null)
              if [[ -n "$report" ]]; then
                cat "$report"
              else
                echo "_No results._"
              fi
              echo ""
            done
          } >> "$GITHUB_STEP_SUMMARY"

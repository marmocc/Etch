name: Benchmarks

on:
  pull_request:
    paths:
      - "Etch/**"
      - "Etch.Benchmarks/**"
      - ".github/workflows/benchmarks.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Other ref/SHA to benchmark against master"
        required: true
        type: string

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Checkout master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Run benchmarks on master
        run: |
          dotnet run --project Etch.Benchmarks -c Release -- \
            --filter '*' \
            --exporters markdown \
            --artifacts ./BenchmarkDotNet.Artifacts/master

      - name: Checkout other
        run: |
          git checkout ${{ github.event.pull_request.head.sha || inputs.ref }}

      - name: Run benchmarks on other
        run: |
          dotnet run --project Etch.Benchmarks -c Release -- \
            --filter '*' \
            --exporters markdown \
            --artifacts ./BenchmarkDotNet.Artifacts/other

      - name: Write results to job summary
        if: always()
        run: |
          {
            echo "## master results"
            if compgen -G "BenchmarkDotNet.Artifacts/master/results/*.md" > /dev/null; then
              cat BenchmarkDotNet.Artifacts/master/results/*.md
            else
              echo "_No results._"
            fi

            echo ""
            echo "## other results"
            if compgen -G "BenchmarkDotNet.Artifacts/other/results/*.md" > /dev/null; then
              cat BenchmarkDotNet.Artifacts/other/results/*.md
            else
              echo "_No results._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

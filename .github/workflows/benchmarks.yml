name: Benchmarks

on:
  pull_request:
    paths:
      - "Etch/**"
      - "Etch.Benchmarks/**"
      - ".github/workflows/benchmarks.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Other ref/SHA to benchmark against master"
        required: true
        type: string

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Checkout master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: master
          ref: master

      - name: Add worktree for other
        working-directory: master
        run: |
          git worktree add ../other ${{ github.event.pull_request.head.sha || inputs.ref }}

      - name: Run first benchmark on master
        run: |
          dotnet run --project ../master/Etch.Benchmarks -c Release -- \
            --filter '*' \
            --exporters markdown \
            --artifacts ./BenchmarkDotNet.Artifacts/first-master

      - name: Run first benchmark on other
        run: |
          dotnet run --project ../other/Etch.Benchmarks -c Release -- \
            --filter '*' \
            --exporters markdown \
            --artifacts ./BenchmarkDotNet.Artifacts/first-other

      - name: Run second benchmark on master
        run: |
          dotnet run --project ../master/Etch.Benchmarks -c Release -- \
            --filter '*' \
            --exporters markdown \
            --artifacts ./BenchmarkDotNet.Artifacts/second-master

      - name: Run second benchmark on other
        run: |
          dotnet run --project ../other/Etch.Benchmarks -c Release -- \
            --filter '*' \
            --exporters markdown \
            --artifacts ./BenchmarkDotNet.Artifacts/second-other
      
      - name: Write results to job summary
        if: always()
        run: |
          {
            for dir in first-master first-other second-master second-other; do
              echo "## $dir"
              report=$(find "BenchmarkDotNet.Artifacts/$dir/results" -name '*-report-github.md' -print -quit 2>/dev/null)
              if [[ -n "$report" ]]; then
                cat "$report"
              else
                echo "_No results._"
              fi
              echo ""
            done
          } >> "$GITHUB_STEP_SUMMARY"
